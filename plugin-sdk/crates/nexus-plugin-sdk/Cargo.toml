# Nexus Realm
# File: Cargo.toml
# Purpose: Nexus Realm plugin SDK for Rust plugin developers

[package]
name = "nexus-plugin-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Nexus Realm Plugin SDK: write Nexus Realm plugins in Rust and compile them to WebAssembly"
repository = "https://github.com/tsx-awtns/Auto-Messager---Nexa-Realm-APP"

[dependencies]
nexus-plugin-api = { path = "../nexus-plugin-api", version = "0.1.0" }
serde_json = "1"
