# Nexus Realm
# File: Cargo.toml
# Purpose: Nexus Realm plugin developer CLI package

[package]
name = "nexus-plugin-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Nexus Realm plugin developer CLI: create, build, validate, and pack .nexusplugin packages"
repository = "https://github.com/tsx-awtns/Auto-Messager---Nexa-Realm-APP"

[[bin]]
name = "nexus-plugin"
path = "src/main.rs"

[dependencies]
nexus-plugin-api = { path = "../nexus-plugin-api", version = "0.1.0" }
nexus-plugin-package = { path = "../nexus-plugin-package", version = "0.1.0" }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
